<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Engine</title>
    <link rel="icon" href="./src/assets/icon.svg">
</head>
<body>
    <!-- display: contents, so the shell's elements lay out as children of <body>, as they did. -->
    <div id="root" style="display: contents"></div>
    <!--
      Order matters and is the source's order. The module renders every page's
      and modal's markup synchronously; the deferred classic scripts then run in
      document order, before DOMContentLoaded, exactly as the one-file app did.
      Page-only code is not here: it loads on a page's first visit (src/lib/pages.js).
    -->
    <script type="module" src="/src/main.jsx"></script>
    <script defer src="./legacy/vendor/three.min.js"></script>
    <script defer src="./legacy/vendor/gltf-loader.js"></script>
    <script defer src="./legacy/core.js"></script>
    <script defer src="./legacy/production-graph.js"></script>
    <script defer src="./legacy/shell.js"></script>
</body>
</html>
