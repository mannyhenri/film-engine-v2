<div class="modal-overlay" id="castingModal">
        <div class="modal modal-wide">
            <div class="modal-header">
                <h3 id="castingTitle">Voice</h3>
                <button class="modal-close" onclick="closeModal('castingModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="gal-bar">
                    <input type="text" id="auditionLine" class="input"
                           placeholder="A line to hear — leave blank to use one from the screenplay">
                    <button class="btn btn-primary btn-sm" onclick="auditionVoice()">Audition</button>
                    <span id="castingStatus" class="text-muted text-sm"></span>
                </div>
                <p class="text-muted text-sm" style="margin:0 0 12px;">
                    Previews below are hosted by the provider and cost nothing.
                    <strong>Audition</strong> speaks your line in the selected voice and does spend.
                    Nothing here is attached to a shot.
                </p>
                <div id="castingBody"></div>
            </div>
        </div>
    </div>
