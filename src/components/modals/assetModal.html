<div class="modal-overlay" id="assetModal">
        <div class="modal">
            <div class="modal-header"><h3>Register Asset</h3><button class="modal-close" onclick="closeModal('assetModal')">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Asset Type</label>
                    <select data-field="asset_type">
                        <option value="keyframe">Keyframe</option>
                        <option value="storyboard">Storyboard</option>
                        <option value="video_raw">Video Raw</option>
                        <option value="video_synced">Video Synced</option>
                        <option value="video_final">Video Final</option>
                        <option value="audio_dialogue">Audio Dialogue</option>
                        <option value="audio_music">Audio Music</option>
                        <option value="audio_sfx">Audio SFX</option>
                        <option value="audio_ambient">Audio Ambient</option>
                        <option value="thumbnail">Thumbnail</option>
                        <option value="reference_image">Reference Image</option>
                        <option value="character_sheet">Character Sheet</option>
                        <option value="lora_weights">LoRA Weights</option>
                        <option value="voice_sample">Voice Sample</option>
                        <option value="subtitle">Subtitle</option>
                        <option value="lut">LUT</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group"><label>File Path</label><input type="text" data-field="file_path" placeholder="/data/film/..."></div>
                <div class="form-group"><label>File Name</label><input type="text" data-field="file_name" placeholder="filename.ext"></div>
                <div class="form-group"><label>Format</label><input type="text" data-field="format" placeholder="png, wav, mp4..."></div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="registerAsset()">Register</button>
                    <button class="btn btn-secondary" onclick="closeModal('assetModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>
