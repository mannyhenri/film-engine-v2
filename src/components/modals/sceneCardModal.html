<div class="modal-overlay" id="sceneCardModal">
        <div class="modal">
            <div class="modal-header"><h3 id="sceneCardTitle">Scene</h3><button class="modal-close" onclick="closeModal('sceneCardModal')">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="sceneCardIndex">
                <div class="form-group"><label>Scene heading</label>
                    <input type="text" id="sceneCardHeading" placeholder="INT. KITCHEN - DAY"></div>
                <div class="form-group"><label>What happens</label>
                    <textarea id="sceneCardSynopsis" rows="7"></textarea></div>
                <p class="text-muted text-sm">This writes into the screenplay itself &mdash; the
                   heading, and the action beneath it. The cards are a view of the script, not a
                   second copy of it.</p>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveIndexCard()">Save</button>
                    <button class="btn btn-secondary" onclick="closeModal('sceneCardModal')">Cancel</button>
                    <button class="btn btn-danger" onclick="deleteIndexCard()">Delete scene</button>
                </div>
            </div>
        </div>
    </div>
