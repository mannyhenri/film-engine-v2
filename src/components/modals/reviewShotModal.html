<div class="modal-overlay" id="reviewShotModal">
        <div class="modal">
            <div class="modal-header"><h3>Review Shot</h3><button class="modal-close" onclick="closeModal('reviewShotModal')">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Decision</label>
                    <select id="reviewDecision">
                        <option value="approve">Approve</option>
                        <option value="reject">Reject</option>
                    </select>
                </div>
                <div class="form-group"><label>Notes</label><textarea id="reviewNotes" rows="3" placeholder="Review notes..."></textarea></div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
                    <button class="btn btn-secondary" onclick="closeModal('reviewShotModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>
