<div class="modal-overlay" id="propModal">
        <div class="modal">
            <div class="modal-header"><h3 id="propModalTitle">New Prop</h3><button class="modal-close" onclick="closeModal('propModal')">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="propEditId">
                <div class="form-group"><label>Name</label><input type="text" data-field="name" placeholder="Prop name"></div>
                <div class="form-group"><label>Description</label><textarea data-field="description" rows="2" placeholder="Describe this prop..."></textarea></div>
                <div class="form-group"><label>Visual Prompt</label><textarea data-field="visual_prompt" rows="2" placeholder="Visual description for AI..."></textarea></div>
                <div class="form-group">
                    <label>Real size &mdash; metres</label>
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
                        <input type="number" step="0.01" min="0" data-field="height_m" placeholder="height">
                        <input type="number" step="0.01" min="0" data-field="width_m" placeholder="width">
                        <input type="number" step="0.01" min="0" data-field="length_m" placeholder="length">
                    </div>
                </div>
                <p class="text-sm text-muted" style="margin:-4px 0 10px;line-height:1.5;">An image model has no sense of scale, and a reference plate makes it worse &mdash; a plate is a close-up filling its own frame, so conditioning on one without a size reproduces what it was shown. This is how a 30cm sprinkler comes out the size of a car.</p>
                <!--
                  Filled from GET /film/card-vocabulary, never typed here.
                  This list was hand-written and offered `clothing` and
                  `personal`, NEITHER of which the CHECK constraint on
                  film_props.category allows — so picking either failed the
                  insert, and the picker was the only place that believed they
                  were real. The editor must not be able to offer a value the
                  database refuses.
                -->
                <div class="form-group"><label>Category</label>
                    <select data-field="category" id="propCategorySelect">
                        <option value="generic">Generic</option>
                    </select>
                </div>
                <!-- Stored by film_props and accepted by PUT /props/:id with no
                     control anywhere: a field only an agent could set. -->
                <div class="form-group">
                    <label>Notes</label>
                    <textarea data-field="notes" rows="2" placeholder="Where it came from, which scenes it must match, anything continuity needs to know..."></textarea>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveProp()">Save</button>
                    <button class="btn btn-secondary" onclick="closeModal('propModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>
