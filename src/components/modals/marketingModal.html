<div class="modal-overlay" id="marketingModal">
        <div class="modal">
            <div class="modal-header"><h3>New Marketing Asset</h3><button class="modal-close" onclick="closeModal('marketingModal')">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Type</label>
                    <select id="mkType">
                        <option value="poster">Poster</option>
                        <option value="key_art">Key art</option>
                        <option value="banner">Banner</option>
                        <option value="social_card">Social card</option>
                        <option value="still">Still</option>
                        <option value="thumbnail">Thumbnail</option>
                        <option value="logo">Logo</option>
                    </select>
                </div>
                <div class="form-group"><label>Title</label>
                    <input id="mkTitle" type="text" placeholder="Teaser one-sheet"></div>
                <div class="form-group"><label>What it should show</label>
                    <textarea id="mkPrompt" rows="3" placeholder="The dragon's shadow crossing an empty suburban street at blue hour, seen from below"></textarea>
                    <div class="text-sm text-muted" style="margin-top:4px;">
                        Leads the prompt. The film's style preset is added after it, so this describes
                        the <em>subject</em> rather than the look.
                    </div>
                </div>
                <div class="form-group"><label>Aspect ratio</label>
                    <select id="mkAspect">
                        <option value="2:3">2:3 &mdash; one-sheet poster</option>
                        <option value="16:9">16:9 &mdash; banner, thumbnail</option>
                        <option value="1:1">1:1 &mdash; social card</option>
                        <option value="9:16">9:16 &mdash; story, vertical</option>
                        <option value="4:5">4:5 &mdash; feed</option>
                    </select>
                </div>
                <div class="form-group"><label>Resolution</label>
                    <input id="mkResolution" type="text" value="1080x1620" placeholder="1080x1620"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('marketingModal')">Cancel</button>
                <button class="btn btn-primary" onclick="createMarketingAsset()">Create</button>
            </div>
        </div>
        </div>
