<div class="modal-overlay" id="editMilestoneModal">
        <div class="modal">
            <div class="modal-header"><h3>Edit Milestone</h3><button class="modal-close" onclick="closeModal('editMilestoneModal')">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="editMilestoneId">
                <div class="form-group"><label>Status</label>
                    <select data-field="status">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="skipped">Skipped</option>
                    </select>
                </div>
                <div class="form-group"><label>Completion %</label><input type="number" data-field="completion_pct" min="0" max="100" value="0"></div>
                <div class="form-group"><label>Target Date</label><input type="date" data-field="target_date"></div>
                <div class="form-group"><label>Description</label><textarea data-field="description" rows="2"></textarea></div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="updateMilestone()">Save</button>
                    <button class="btn btn-secondary" onclick="closeModal('editMilestoneModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>
