    <!-- Create Location -->
    <div class="modal-overlay" id="locationModal">
        <div class="modal">
            <div class="modal-header"><h3 id="locationModalTitle">New Location</h3><button class="modal-close" onclick="closeModal('locationModal')">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="locationEditId">
                <div class="form-group"><label>Name</label><input type="text" data-field="name" placeholder="Location name"></div>
                <div class="form-group"><label>Description</label><textarea data-field="description" rows="2" placeholder="Describe this location..."></textarea></div>
                <div class="form-group"><label>Reference Prompt</label><textarea data-field="reference_prompt" rows="2" placeholder="Visual description for AI..."></textarea></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div class="form-group"><label>Lighting Default</label><input type="text" data-field="lighting_default" placeholder="natural, dramatic..."></div>
                    <div class="form-group"><label>Time of Day</label><input type="text" data-field="time_of_day_default" placeholder="day, night, dusk..."></div>
                </div>
                <div class="form-group"><label>Atmosphere Notes</label><textarea data-field="atmosphere_notes" rows="2" placeholder="Mood, atmosphere..."></textarea></div>
                <!-- Stored by film_locations and accepted by PUT /locations/:id
                     with no control anywhere: a field only an agent could set. -->
                <div class="form-group">
                    <label>Sound Notes</label>
                    <textarea data-field="sound_notes" rows="2" placeholder="Traffic two streets over, a screen door, gulls..."></textarea>
                    <p class="text-sm text-muted" style="margin-top:6px;line-height:1.5;">
                        Notes for you and for whoever writes the ambient cue. Not sent to a generator &mdash;
                        an ambient bed is generated from the scene, not from this field.
                    </p>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveLocation()">Save</button>
                    <button class="btn btn-secondary" onclick="closeModal('locationModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>
