<div class="page" id="page-marketing">
            <div class="flex-between mb-16">
                <h2>Marketing</h2>
                <div>
                    <select id="marketingFilter" onchange="loadMarketing()" style="width:auto;display:inline-block;min-width:150px;margin-right:8px;">
                        <option value="">All types</option>
                        <option value="poster">Poster</option>
                        <option value="key_art">Key art</option>
                        <option value="banner">Banner</option>
                        <option value="social_card">Social card</option>
                        <option value="still">Still</option>
                        <option value="thumbnail">Thumbnail</option>
                        <option value="logo">Logo</option>
                    </select>
                    <button class="btn btn-primary" onclick="showModal('marketingModal')">+ Asset</button>
                </div>
            </div>
            <p class="text-sm text-muted mb-8">
                Artwork that ships beside the film. Upload something you made in a design tool, or
                generate it &mdash; generation uses the film&rsquo;s own style preset, so the art looks
                like the film rather than like a different one.
            </p>
            <div class="entity-grid" id="marketingGrid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));"></div>
        </div>
