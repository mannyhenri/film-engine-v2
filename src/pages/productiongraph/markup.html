<div class="page" id="page-productiongraph">
            <div class="pg-header">
                <h2>Production</h2>
                <span class="pg-meta" id="pgMeta"></span>
                <span class="pg-legend" id="pgLegend"></span>
                <div class="pg-chips" id="pgScenes"></div>
                <div style="flex-grow:1;"></div>
                <button class="pg-hbtn" title="Re-place the nodes you haven't moved" onclick="pgTidy()">Tidy layout</button>
                <button class="pg-hbtn" id="pgLockBtn" title="Nothing that replaces a frame runs while the board is locked" onclick="pgToggleLock()">Lock board</button>
                <button class="pg-hbtn" id="pgRunChangedBtn" title="Redo only what is behind, in order, after one confirmation" onclick="pgRunChanged()">Run what changed</button>
                <button class="pg-hbtn primary" id="pgRunBtn" onclick="pgRunPending()">Run pending</button>
            </div>
            <div class="pg-body" id="pgBody">
                <div class="pg-canvas" id="pgCanvas">
                    <div class="pg-world" id="pgWorld"></div>
                    <div class="pg-empty">Loading the graph&hellip;</div>
                    <div class="pg-furniture">
                        <button class="pg-zbtn" aria-label="Zoom out" onclick="pgZoomBy(1/1.15)">&minus;</button>
                        <span class="pg-zoom" id="pgZoom">90%</span>
                        <button class="pg-zbtn" aria-label="Zoom in" onclick="pgZoomBy(1.15)">+</button>
                        <button class="pg-sbtn" style="height:24px;" onclick="pgFit()">Fit</button>
                        <span style="width:1px;height:16px;background:#2c2c34;margin:0 2px;"></span>
                        <span class="pg-legend"><span><i style="background:#c07ce0"></i>image</span><span><i style="background:#e2c15a"></i>video</span>
                            <span><i style="background:#57c98a"></i>audio</span><span><i style="background:#8a8aff"></i>scene</span>
                            <span><i style="background:#56c8d8"></i>plates</span></span>
                    </div>
                    <div class="pg-minimap" id="pgMinimap" title="Click to move the view"></div>
                </div>
                <div class="pg-queue" id="pgQueue"></div>
                <div class="pg-playback" id="pgPlayback"></div>
                <aside class="pg-drawer" id="pgDrawer" aria-label="Inspector">
                    <div class="pg-dscroll" id="pgDrawerBody"></div>
                    <div class="pg-dfoot" id="pgDrawerFoot"></div>
                </aside>
            </div>
            <div class="pg-menu" id="pgMenu" hidden></div>
        </div>
