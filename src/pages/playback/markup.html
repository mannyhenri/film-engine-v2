        <!-- ── 14. NOTES & REVIEWS ──────────────────────────────── -->
        <!-- ==== CLAUDE:START editorial pages (gaps 3/4/5/7d) ==== -->

        <!-- Gap 3 + 4: watch the assembled cut, note an exact moment -->
        <div class="page" id="page-playback">
            <div class="page-header"><h2>Playback</h2></div>
            <div class="flex-between mb-16">
                <div class="text-sm text-muted" id="playbackSummary">Loading timeline…</div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"
                           title="Draw what a vertical or square placement would keep, over the cut">
                        Protect
                        <select id="pbProtectRatio" onchange="renderPlaybackProtect()"
                                style="width:auto;display:inline-block;min-width:110px;">
                            <option value="">off</option>
                        </select>
                    </label>
                    <button class="btn btn-secondary btn-sm" onclick="loadPlayback()">Refresh</button>
                </div>
            </div>

            <div id="playbackEmpty" class="glossary-empty hidden">
                No shots yet. Create shots on the Shot Board, then generate video —
                the assembled cut appears here.
            </div>

            <div id="playbackMain" class="hidden">
                <div class="pb-stage">
                    <video id="pbVideo" class="pb-video" preload="metadata" playsinline></video>
                    <!--
                      The protect frame, over the CUT.
                      The board shows whether a frame survives a vertical crop;
                      only playback shows whether the ACTION does. Sized in
                      script against the video's own pixels, because the stage
                      is the project's shape and the clip may not be.
                    -->
                    <div id="pbProtect" style="position:absolute;display:none;pointer-events:none;z-index:3;"></div>
                    <!--
                      The shot's dialogue.
                      lib/timeline.js has picked audio_mix or audio_dialogue per
                      shot since it was written and playback ignored it — so you
                      could watch the cut and never hear the scene. Hidden: it is
                      heard, not seen, and its transport is the timeline's.
                    -->
                    <audio id="pbAudio" preload="auto" style="display:none;"></audio>
                    <!--
                      The scene's SCORE and its AMBIENT BED.
                      Separate elements because they are separate decisions with
                      separate levels, and a director wants to hear the score
                      without the room and the room without the score. They span
                      whole scenes, so they are not restarted at each cut —
                      restarting a score on every shot is the one thing that
                      would make it sound obviously wrong.
                    -->
                    <audio id="pbMusic" preload="auto" style="display:none;"></audio>
                    <audio id="pbAmbient" preload="auto" style="display:none;"></audio>
                    <div id="pbStill" class="pb-still hidden"></div>
                    <div id="pbGap" class="pb-gap hidden">
                        <div>
                            <div class="pb-gap-title">No picture for this shot</div>
                            <div class="text-sm text-muted" id="pbGapDetail"></div>
                        </div>
                    </div>
                </div>

                <!-- Scrub bar across the WHOLE cut, with note markers -->
                <div class="pb-scrub-wrap">
                    <div class="pb-scrub" id="pbScrub" onclick="pbSeekFromClick(event)">
                        <div class="pb-scrub-fill" id="pbScrubFill"></div>
                        <div class="pb-shot-ticks" id="pbShotTicks"></div>
                        <div class="pb-note-markers" id="pbNoteMarkers"></div>
                        <div class="pb-mark-range" id="pbMarkRange" style="display:none;"></div>
                    </div>
                    <div class="flex-between mt-8">
                        <div class="pb-transport">
                            <button class="btn btn-secondary btn-sm" onclick="pbTogglePlay()" id="pbPlayBtn">Play</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbFrameStep(-1)" title="One frame back (←)">&#8249;|</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbFrameStep(1)" title="One frame forward (→)">|&#8250;</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbMarkIn()" title="Mark the point a repair starts from (I)">Mark in</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbMarkOut()" title="Mark the point a repair must arrive at">Mark out</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbClearMarks()" id="pbClearMarksBtn" style="display:none;">Clear marks</button>
                            <button class="btn btn-primary btn-sm" onclick="pbRunRepair()" id="pbRepairBtn" style="display:none;">Repair this</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbStep(-1)" title="Previous shot">&#9664;&#9664;</button>
                            <button class="btn btn-secondary btn-sm" onclick="pbStep(1)" title="Next shot">&#9654;&#9654;</button>
                            <label class="text-sm" style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;cursor:pointer;"
                                   title="Play each shot's dialogue as its shot comes up">
                                <input type="checkbox" id="pbDialogue" checked onchange="pbDialogueToggled()"> Dialogue
                            </label>
                            <label class="text-sm" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;"
                                   title="Play each shot's camera move over its storyboard frame">
                                <input type="checkbox" id="pbMotion" checked onchange="pbMotionToggled()"> Camera move
                            </label>
                            <label class="text-sm" id="pbScoreLabel" style="display:none;align-items:center;gap:6px;cursor:pointer;"
                                   title="Play each scene's score under its shots">
                                <input type="checkbox" id="pbScore" checked onchange="pbBedsToggled()"> Score
                            </label>
                            <label class="text-sm" id="pbAmbientLabel" style="display:none;align-items:center;gap:6px;cursor:pointer;"
                                   title="Play each scene's ambient bed under its shots">
                                <input type="checkbox" id="pbAmbient2" checked onchange="pbBedsToggled()"> Ambient
                            </label>
                            <!--
                              THE ONE CONTROL HERE THAT SPENDS MONEY.
                              It shipped between the Camera move and Score
                              checkboxes, in the same grey as them — a paid
                              action reading as another view toggle, in a row of
                              six. Asked "where is the redo dialogue" by the
                              person who asked for it, which is the only test of
                              a placement that matters. Separated from the
                              switches, and marked: everything to the left
                              changes what you HEAR, this changes what EXISTS.
                            -->
                            <span class="pb-sep" aria-hidden="true"></span>
                            <button class="btn btn-warning btn-sm" onclick="pbRegenerateDialogue()"
                                    title="Buy a fresh take of this scene's dialogue — after a rewrite, a recast, or a change of delivery direction. Costs credits.">&#127908; Redo dialogue</button>
                            <span id="pbMoveLabel" class="text-sm text-muted"></span>
                            <span id="pbBedLabel" class="text-sm text-muted"></span>
                        </div>
                        <div class="pb-timecode">
                            <span id="pbTimecode">00:00:00:00</span>
                            <span class="text-muted"> / </span>
                            <span id="pbTotalTimecode" class="text-muted">00:00:00:00</span>
                        </div>
                    </div>
                </div>

                <div class="pb-columns">
                    <div>
                        <div class="section-label">Shot list</div>
                        <div id="pbPlaylist" class="pb-playlist"></div>
                    </div>
                    <div>
                        <!-- Gap 4: the note is pinned to wherever the playhead is -->
                        <div class="section-label">Note at this moment</div>
                        <div class="pb-note-box">
                            <div class="text-sm mb-8">
                                Pinning to <strong id="pbNoteTarget">—</strong>
                            </div>
                            <select id="pbNoteType" class="mb-8">
                                <option value="general">General</option>
                                <option value="direction">Direction</option>
                                <option value="revision">Revision</option>
                                <option value="camera">Camera</option>
                                <option value="lighting">Lighting</option>
                                <option value="performance">Performance</option>
                                <option value="continuity">Continuity</option>
                                <option value="vfx">VFX</option>
                                <option value="color">Color</option>
                                <option value="audio">Audio</option>
                            </select>
                            <textarea id="pbNoteText" rows="3" placeholder="What is wrong at this frame?"></textarea>
                            <button class="btn btn-primary btn-sm mt-8" onclick="pbAddNote()">Add note here</button>
                            <div id="pbNoteStatus" class="text-sm text-muted mt-8"></div>
                        </div>

                        <div class="section-label mt-16">Timecoded notes</div>
                        <div id="pbNoteList" class="pb-note-list"></div>
                    </div>
                </div>
            </div>
        </div>
