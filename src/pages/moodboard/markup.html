        <!-- ── 6. STORYBOARD ────────────────────────────────────── -->
        <div class="page" id="page-moodboard">
            <div class="flex-between mb-16">
                <h2>Mood Board</h2>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-secondary" onclick="moodBoardCompose(false)">Preview style</button>
                    <button class="btn btn-primary" onclick="moodBoardCompose(true)" data-tooltip="Write this look onto the project" data-tooltip-pos="bottom">Apply look</button>
                </div>
            </div>
            <div class="card mb-16">
                <!-- form-group is what makes a label block in this app; a bare
                     div leaves it inline, which put the caption on the same
                     line as its field and collapsed the field to nothing. And
                     the width rule is keyed on input[type], so an input without
                     one is never sized. -->
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0;min-width:140px;">
                        <label>Facet</label><select id="moodKind"></select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;flex:1 1 260px;">
                        <label>Note</label>
                        <input type="text" id="moodNote" placeholder="teal shadows, amber sodium practicals">
                    </div>
                    <div class="form-group" style="margin-bottom:0;min-width:150px;">
                        <label>Spec</label>
                        <select id="moodSpecKind" onchange="moodSpecValues()"><option value="">&mdash;</option></select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;min-width:130px;">
                        <label>Value</label><select id="moodSpecValue"></select>
                    </div>
                    <button class="btn btn-secondary" onclick="moodBoardAdd()" style="height:36px;">Add</button>
                    <!--
                      The pictures a director brings to a look meeting are almost
                      never ones this tool made. The board could only pin images
                      Film Engine had generated, which is backwards for look
                      development.
                    -->
                    <label class="btn btn-secondary" style="height:36px;line-height:22px;cursor:pointer;margin:0;"
                           title="Pin a film still, a photograph or a painting you already have">Upload image
                        <input type="file" data-import-target="mood-board-image"
                               accept="image/png,image/jpeg,.png,.jpg,.jpeg" style="display:none"
                               onchange="uploadMoodBoardImage(event)">
                    </label>
                </div>
            </div>
            <div id="moodComposed" class="card mb-16" style="display:none;"></div>
            <div id="moodEntries" class="entity-grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));"></div>
        </div>
