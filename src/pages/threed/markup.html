        <!-- ── 3D MODELS ──────────────────────────────────────────── -->
        <div class="page" id="page-threed">
            <div class="flex-between mb-16">
                <h2>3D Models</h2>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <label class="btn btn-secondary" style="cursor:pointer;">
                        Import GLB
                        <input data-import-target="three-d-model" type="file" accept=".glb,model/gltf-binary" style="display:none" onchange="importThreeDModel(event)">
                    </label>
                    <button class="btn btn-primary" onclick="generateAllModels()">Generate All Models</button>
                </div>
            </div>
            <div id="threedProgress" style="display:none;" class="mb-16">
                <div class="text-sm text-muted mb-8" id="threedProgressLabel">Starting...</div>
                <div style="background:var(--gl-bg-surface);border-radius:var(--gl-radius-md);height:10px;overflow:hidden;">
                    <div id="threedProgressBar" style="height:100%;width:0%;background:var(--gl-accent,#6366f1);transition:width .2s;"></div>
                </div>
            </div>

            <h3 class="mb-8" style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--gl-text-muted);">Subjects</h3>
            <div class="entity-grid mb-16" id="threedSubjects" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));"></div>

            <h3 class="mb-8" style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--gl-text-muted);">Generated Models</h3>
            <div class="entity-grid" id="threedModels" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));"></div>
        </div>
