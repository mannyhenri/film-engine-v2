        <!-- ── MUSIC & SOUND ──────────────────────────────────────── -->
        <div class="page" id="page-music">
            <div class="flex-between mb-16">
                <h2>Music &amp; Sound</h2>
                <button class="btn btn-primary" onclick="generateAllMusic()">Generate All (score + ambient)</button>
            </div>
            <div id="musicProgress" style="display:none;" class="mb-16">
                <div class="text-sm text-muted mb-8" id="musicProgressLabel">Starting...</div>
                <div style="background:var(--gl-bg-surface);border-radius:var(--gl-radius-md);height:10px;overflow:hidden;">
                    <div id="musicProgressBar" style="height:100%;width:0%;background:var(--gl-accent,#6366f1);transition:width .2s;"></div>
                </div>
            </div>
            <!--
                THE LIBRARY. Every audio file in the project, one card each.
                The cue sheet below is about INTENTIONS — music somebody wrote
                a brief for. This is about files that exist, which is a
                different list and, on a real project, a far longer one:
                dialogue is not a cue, so a cue-shaped page could never show
                86 of the 95 sounds in the film.
            -->
            <div class="flex-between mb-8" style="align-items:flex-end;">
                <div>
                    <h3 style="margin:0;">Sound library</h3>
                    <p class="text-sm text-muted" style="margin:2px 0 0;" id="soundLibCount">&nbsp;</p>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <div id="soundLibFilters" style="display:flex;gap:6px;"></div>
                    <button class="btn btn-primary" onclick="openSoundGenerator()">+ Generate sound</button>
                </div>
            </div>
            <div class="entity-grid" id="soundLibGrid"
                 style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-bottom:28px;"></div>

            <h3 style="margin:0 0 2px;">Cues</h3>
            <p class="text-sm text-muted" style="margin:0 0 10px;">What the music should be, per scene — the brief a score is generated from.</p>
            <div class="entity-grid" id="musicGrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
        </div>
