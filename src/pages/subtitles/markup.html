<div class="page" id="page-subtitles">
            <div class="flex-between mb-16">
                <h2>Subtitles</h2>
                <div>
                    <select id="subtitleLang" onchange="loadSubtitles()" style="width:auto;display:inline-block;min-width:140px;margin-right:8px;"></select>
                    <button class="btn btn-secondary" onclick="exportSubtitles('srt')">Export SRT</button>
                    <button class="btn btn-secondary" onclick="exportSubtitles('vtt')">Export VTT</button>
                    <button class="btn btn-primary" onclick="openSubtitle()">+ Cue</button>
                </div>
            </div>
            <p class="text-sm text-muted mb-8">
                One row per cue, in time order. A cue carries its language, who is speaking, where on
                screen it sits and how it is styled &mdash; all of which the route has always accepted
                and none of which could be typed. Times are in seconds here and stored in
                milliseconds.
            </p>
            <div id="subtitleList"></div>
        </div>
