<div class="page" id="page-flows">
            <div class="flex-between mb-16">
                <div style="display:flex;gap:10px;align-items:center;">
                    <button class="btn btn-secondary btn-sm" id="flowBackToGraph" hidden onclick="flowBackToGraph()"
                        title="Return to the Production graph you opened this flow from">&larr; Back to the graph</button>
                    <h2>Flows</h2>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <select id="flowSelect" style="min-width:260px;" onchange="flowCanvasOpen(this.value)"></select>
                    <button class="btn btn-secondary" onclick="flowCanvasNew()">New flow</button>
                    <button class="btn btn-secondary" onclick="flowCanvasFromTemplate()">From template</button>
                    <button class="btn btn-secondary" onclick="flowCanvasDuplicate()">Duplicate</button>
                    <button class="btn btn-secondary" onclick="flowCanvasSave()" id="flowSaveBtn">Save</button>
                    <button class="btn btn-primary" onclick="flowCanvasRun()" id="flowRunBtn">Run flow</button>
                </div>
            </div>

            <div class="flow-workspace">
                <aside class="flow-palette" id="flowPalette"></aside>

                <div class="flow-canvas-wrap">
                    <svg id="flowCanvas" class="flow-canvas" onmousedown="flowCanvasBackgroundDown(event)"></svg>
                    <div class="flow-toolbar">
                        <button class="btn btn-sm" onclick="flowCanvasZoom(-0.15)">&minus;</button>
                        <span id="flowZoomLabel" class="text-sm text-muted">100%</span>
                        <button class="btn btn-sm" onclick="flowCanvasZoom(0.15)">+</button>
                        <button class="btn btn-sm" onclick="flowCanvasFit()">Fit</button>
                        <button class="btn btn-sm" onclick="flowCanvasDeleteSelected()">Delete</button>
                        <span class="flow-status" id="flowStatus"></span>
                    </div>
                </div>

                <aside class="flow-inspector" id="flowInspector">
                    <p class="text-sm text-muted">Select a node to edit it.</p>
                </aside>
            </div>

            <div class="card mt-16" id="flowRunPanel" style="display:none;">
                <h3 class="mb-8">Run</h3>
                <div id="flowRunOutput" class="text-sm"></div>
            </div>
        </div>
